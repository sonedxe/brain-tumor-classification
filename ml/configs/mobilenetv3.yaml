model: mobilenetv3
timm_name: mobilenetv3_large_100
pretrained: true
role: candidato

input:
  size: 256
  layout: NCHW
  channels: 3

normalization:
  mode: tanh
  mean: [0.5, 0.5, 0.5]
  std: [0.5, 0.5, 0.5]

augmentation:
  rotation_range: 20
  zoom_range: 0.15
  horizontal_flip: 0.5
  brightness_range: [0.85, 1.15]

# Head: clasificador por defecto de timm con num_classes=4 y este dropout.
# (train.py solo consume `dropout`; no hay capa oculta configurable.)
head:
  dropout: 0.3

training:
  loss: cross_entropy
  batch_size: 32
  epochs: 30
  optimizer: adamw
  learning_rate: 0.0001
  weight_decay: 0.0001
  scheduler: cosine
  early_stopping_patience: 7

transfer:
  freeze_backbone: true
  unfreeze_from_epoch: 15

validation:
  strategy: kfold
  k_folds: 5
  stratified: true
  seed: 42

gradcam:
  # Ultima convolucion de timm mobilenetv3_large_100 (no existe `features`).
  target_layer: conv_head
  method: gradcam

export:
  formats: [keras, tflite, onnx]
  quantization: float16
