model: resnet18
timm_name: resnet18
pretrained: true
role: referencia

input:
  size: 256
  layout: NCHW
  channels: 3

normalization:
  mode: imagenet
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]

augmentation:
  rotation_range: 20
  zoom_range: 0.15
  horizontal_flip: 0.5
  brightness_range: [0.85, 1.15]

# Head: clasificador por defecto de timm con num_classes=4 y este dropout.
# (train.py solo consume `dropout`; no hay capa oculta configurable.)
head:
  dropout: 0.3

training:
  loss: cross_entropy
  batch_size: 32
  epochs: 30
  optimizer: adamw
  learning_rate: 0.0001
  weight_decay: 0.0001
  scheduler: cosine
  early_stopping_patience: 7

transfer:
  freeze_backbone: true
  unfreeze_from_epoch: 15

validation:
  strategy: kfold
  k_folds: 5
  stratified: true
  seed: 42

gradcam:
  target_layer: layer4[-1]
  method: gradcam

export:
  formats: [keras, tflite, onnx]
  quantization: float16
